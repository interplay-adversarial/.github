# Lives in <org>/.github/.github/workflows/pr-agent.yml (public repo, so any org repo can call it).
name: PR Agent (reusable)
on:
  workflow_call:
    inputs:
      model:
        type: string
        # TEMP (2026-10-23): qwen38-27b backend down on TMM MaaS; defaulting to gemma4
        # until it recovers. Revert both defaults together.
        default: gemma4
      api_base:
        type: string
        default: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/gemma4/v1
      max_tokens:
        type: string
        default: "128000"
    secrets:
      MAAS_API_KEY:
        required: true

permissions: {}

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent
        # v0.47.0
        uses: the-pr-agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.MAAS_API_KEY }}
          OPENAI.API_BASE: ${{ inputs.api_base }}
          config.model: openai/${{ inputs.model }}
          config.fallback_models: '["openai/${{ inputs.model }}"]'
          config.custom_model_max_tokens: ${{ inputs.max_tokens }}
          config.duplicate_examples: "true"
          config.temperature: "0.1"                     # lower than the 0.2 default: fewer confident-but-wrong findings
          config.patch_extra_lines_after: "3"            # more trailing hunk context per file (default 1)
          LITELLM.EXTRA_BODY: '{"chat_template_kwargs": {"enable_thinking": false}}'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          pr_description.publish_description_as_comment: "true"   # keep the PR body (git-hygiene needs its sign-off line)
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested"]'
          pr_reviewer.enable_large_pr_chunking: "true"   # split oversized diffs into multiple reviewed chunks instead of clipping/skipping files
          pr_reviewer.max_number_of_calls: "6"           # default 3; allow more chunk calls to cover larger PRs
          pr_reviewer.inline_key_issues: "true"          # anchor each finding to a specific file+line instead of free-text claims
          pr_reviewer.extra_instructions: >-
            Only report a finding if you can cite the exact file and line shown in the diff.
            If the diff does not give enough context to be certain, say so explicitly instead
            of asserting a defect. Never assume the behavior of code that is not shown in this diff.
